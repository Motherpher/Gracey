name: Grace · Analysera ett jobb
description: Lägg in en jobblänk så förbereder Karriärhubben analysen och nästa steg.
title: "[CareerHub Job] "
body:
  - type: markdown
    attributes:
      value: |
        ## Vill du analysera det här jobbet?

        Klistra in länken nedan. Vi tar hand om resten: rollen, arbetsgivaren, kraven, matchningen och ett första ansökningsunderlag.

        Du behöver inte välja metod eller sätta någon egen poäng.

  - type: input
    id: job_url
    attributes:
      label: Länk till jobbet
      placeholder: https://...
    validations:
      required: true

  - type: input
    id: role
    attributes:
      label: Roll (valfritt)
      description: Fyll i bara om jobbsidan är svår att läsa.

  - type: input
    id: employer
    attributes:
      label: Arbetsgivare (valfritt)

  - type: dropdown
    id: lane
    attributes:
      label: Vilken typ av möjlighet är det?
      options:
        - Huvudspår
        - Närliggande möjlighet
        - Flexibelt / extra
    validations:
      required: true

  - type: input
    id: deadline
    attributes:
      label: Sista ansökningsdag (valfritt)
      placeholder: "2026-10-15"

  - type: textarea
    id: job_text
    attributes:
      label: Jobbtext (valfritt)
      description: Klistra bara in annonstexten om länken inte går att läsa.

  - type: markdown
    attributes:
      value: |
        När du vill starta analysen trycker du på den gröna knappen **Create issue** / **Submit new issue** längst ned.
