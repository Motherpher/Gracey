name: Grace · Välj ett jobb
description: Lägg till ett jobb som Grace vill titta närmare på.
title: "[CareerHub Job] "
body:
  - type: markdown
    attributes:
      value: |
        ## Välj jobb

        Klistra in länken. Karriärhubben skapar en jobbsida, går igenom matchningen och förbereder ett första ansökningsunderlag.

        Repot är privat, men skriv ändå inte in känsliga eller onödiga personuppgifter här.

  - type: input
    id: job_url
    attributes:
      label: Länk till jobbet
      placeholder: https://...
    validations:
      required: true

  - type: input
    id: role
    attributes:
      label: Roll
      description: Valfritt. Fyll i om jobbsidan är svår att läsa automatiskt.

  - type: input
    id: employer
    attributes:
      label: Arbetsgivare
      description: Valfritt.

  - type: dropdown
    id: lane
    attributes:
      label: Spår
      description: Hur ser Grace på jobbet?
      options:
        - Huvudspår
        - Närliggande möjlighet
        - Flexibelt / extra
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Prioritet 1–5
      description: 5 = Sök. 1 = Avvakta.
      options:
        - "5 — Sök"
        - "4 — Mycket intressant"
        - "3 — Intressant"
        - "2 — Svagare träff"
        - "1 — Avvakta"
    validations:
      required: true

  - type: input
    id: deadline
    attributes:
      label: Sista ansökningsdag
      description: Valfritt. Skriv ÅÅÅÅ-MM-DD om datumet är känt.
      placeholder: "2026-10-15"

  - type: textarea
    id: job_text
    attributes:
      label: Jobbtext (valfritt)
      description: Klistra bara in text om länken inte går att läsa.

  - type: checkboxes
    id: public_safe
    attributes:
      label: Integritet
      options:
        - label: Jag har inte lagt in känsliga eller onödiga personuppgifter.
          required: true
