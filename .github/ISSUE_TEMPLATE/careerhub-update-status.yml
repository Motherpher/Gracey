name: Grace · Uppdatera en ansökan
description: Följ vad som händer efter att ett jobb har valts.
title: "[CareerHub Update] "
body:
  - type: input
    id: case_issue
    attributes:
      label: Jobbsidans nummer
      description: Numret på det valda jobbet, till exempel 12.
      placeholder: "12"
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: Nytt läge
      options:
        - Ansökan skickad
        - Kontakt
        - Arbetsprov/Test
        - Intervju 1
        - Intervju 2
        - Intervju 3
        - Intervju 4
        - Intervju 5
        - Möte 1
        - Möte 2
        - Möte 3
        - Möte 4
        - Möte 5
        - Erbjudande
        - Avslutad
        - Avstår
        - Arkiverad
    validations:
      required: true

  - type: input
    id: date
    attributes:
      label: Datum
      description: Valfritt. ÅÅÅÅ-MM-DD.

  - type: input
    id: next_action
    attributes:
      label: Nästa steg
      description: Valfritt.
      placeholder: Förbered exempel till intervjun

  - type: input
    id: next_action_date
    attributes:
      label: Datum för nästa steg
      description: Valfritt.
      placeholder: "2026-10-02"
