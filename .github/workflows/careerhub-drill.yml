name: Grace · Fördjupa ett jobb

on:
  workflow_dispatch:
    inputs:
      job_url:
        description: "Länk till jobbannonsen"
        required: true
        type: string
      lane:
        description: "Vilket spår tillhör jobbet?"
        required: true
        type: choice
        options:
          - core
          - adjacent
          - bridge
        default: core
      job_text:
        description: "Valfritt: klistra in annonstext om länken inte går att läsa"
        required: false
        type: string

permissions:
  contents: read

jobs:
  drill:
    runs-on: ubuntu-latest
    env:
      JOB_URL: ${{ inputs.job_url }}
      JOB_TEXT: ${{ inputs.job_text }}
      LANE: ${{ inputs.lane }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CAREERHUB_MODEL: ${{ secrets.CAREERHUB_MODEL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Förbered karriärhubben
        run: pip install -r CareerHub/requirements.txt

      - name: Förbered matchning och ansökningsunderlag
        run: |
          OUT="CareerHub/output/run-${{ github.run_id }}"
          python CareerHub/scripts/careerhub.py drill             --url "$JOB_URL"             --text "$JOB_TEXT"             --lane "$LANE"             --out "$OUT"

      - name: Gör ansökningsunderlaget tillgängligt
        uses: actions/upload-artifact@v4
        with:
          name: careerhub-application-${{ github.run_id }}
          path: CareerHub/output/run-${{ github.run_id }}/
          retention-days: 14
          if-no-files-found: error
