name: Grace · Analysera jobb manuellt

on:
  workflow_dispatch:
    inputs:
      job_url:
        description: "Publik länk till jobbannons"
        required: true
        type: string
      lane:
        description: "Sök-/ansökningsspår"
        required: true
        type: choice
        options: [core, adjacent, bridge]
        default: core
      job_text:
        description: "Valfritt: klistra in annonstext om länken inte går att läsa"
        required: false
        type: string

permissions:
  contents: read

jobs:
  drill:
    runs-on: ubuntu-latest
    env:
      JOB_URL: ${{ inputs.job_url }}
      JOB_TEXT: ${{ inputs.job_text }}
      LANE: ${{ inputs.lane }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CAREERHUB_MODEL: ${{ secrets.CAREERHUB_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Motherpher/CareerHubZero
          ref: main
          path: .careerhub-zero
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Förbered den centrala CareerHub-motorn
        run: pip install -r .careerhub-zero/requirements.txt
      - name: Bygg HRDM och ansökningsunderlag
        env:
          PYTHONPATH: .careerhub-zero/src
        run: |
          OUT_REL="output/run-${{ github.run_id }}"
          python .careerhub-zero/scripts/careerhub.py --manifest CareerHub/careerhub.yaml drill --url "$JOB_URL" --text "$JOB_TEXT" --lane "$LANE" --out "$OUT_REL"
      - name: Gör ansökningsunderlaget tillgängligt
        uses: actions/upload-artifact@v4
        with:
          name: careerhub-application-${{ github.run_id }}
          path: CareerHub/output/run-${{ github.run_id }}/
          retention-days: 14
          if-no-files-found: error
