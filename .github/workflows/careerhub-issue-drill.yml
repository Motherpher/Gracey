name: Grace · Analysera jobb och förbered ansökan

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: careerhub-state-main
  cancel-in-progress: false

jobs:
  choose:
    if: >-
      (startsWith(github.event.issue.title, '[CareerHub Job]') ||
       startsWith(github.event.issue.title, '[CareerHub Drill]')) &&
      (github.event.issue.author_association == 'OWNER' ||
       github.event.issue.author_association == 'MEMBER' ||
       github.event.issue.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CAREERHUB_MODEL: ${{ secrets.CAREERHUB_MODEL }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Förbered karriärhubben
        run: pip install -r CareerHub/requirements.txt

      - name: Hämta senaste versionen
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Läs jobbet som ska analyseras
        run: |
          mkdir -p /tmp/careerhub-request
          python CareerHub/scripts/issue_request.py             --event "$GITHUB_EVENT_PATH"             --out /tmp/careerhub-request

      - name: Kör full analys och förbered ansökan
        run: |
          JOB_URL="$(cat /tmp/careerhub-request/job_url.txt)"
          LANE="$(cat /tmp/careerhub-request/lane.txt)"
          ROLE="$(cat /tmp/careerhub-request/role.txt)"
          EMPLOYER="$(cat /tmp/careerhub-request/employer.txt)"
          DEADLINE="$(cat /tmp/careerhub-request/deadline.txt)"
          OUT="CareerHub/output/issue-${{ github.event.issue.number }}"

          python CareerHub/scripts/careerhub.py drill             --url "$JOB_URL"             --text-file /tmp/careerhub-request/job_text.txt             --title "$ROLE"             --company "$EMPLOYER"             --deadline "$DEADLINE"             --lane "$LANE"             --out "$OUT"

          cp /tmp/careerhub-request/request.json "$OUT/request.json"

      - name: Spara analyserat jobb och uppdatera översikten
        run: |
          PRIORITY="$(cat /tmp/careerhub-request/priority.txt)"
          python CareerHub/scripts/careerhub.py track             --action choose             --job-json "CareerHub/output/issue-${{ github.event.issue.number }}/job.json"             --issue-number "${{ github.event.issue.number }}"             --issue-url "${{ github.event.issue.html_url }}"             --priority "$PRIORITY"

      - name: Spara förändringen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             CareerHub/data/applications.json             CareerHub/CONTROL_ROOM.md             CareerHub/APPLICATIONS.md             CareerHub/JOB_VAULT.md             CareerHub/visuals/careerhub-journey.svg
          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "Karriärhubben: analysera jobb #${{ github.event.issue.number }}"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Gör ansökningsunderlaget tillgängligt
        uses: actions/upload-artifact@v4
        with:
          name: CareerHub-${{ github.event.issue.number }}-application-pack
          path: CareerHub/output/issue-${{ github.event.issue.number }}/
          retention-days: 14
          if-no-files-found: error

      - name: Berätta att ansökningsunderlaget är klart
        if: success()
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          UPDATE_URL="${{ github.server_url }}/${{ github.repository }}/issues/new?template=careerhub-update-status.yml"
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "$(cat <<EOF
          ## Din analys är klar

          Vi har gått igenom jobbet och förberett nästa steg åt dig. Matchningsanalysen och ansökningsunderlaget är klara.

          **[Hämta ansökningsunderlaget →]($RUN_URL)**

          Öppna **CareerHub-${{ github.event.issue.number }}-application-pack**.

          Sedan:
          1. läs och justera Word-underlaget så att det låter som Grace,
          2. skicka ansökan till arbetsgivaren,
          3. gå tillbaka till Karriärhubben och markera **Ansökan skickad**.

          **[Uppdatera ansökans läge →]($UPDATE_URL)**

          Jobbet finns kvar i historiken, så du kan återvända till det när du vill.
          EOF
          )"

      - name: Förklara om jobbsidan inte gick att läsa
        if: failure()
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "Vi kunde inte läsa hela annonsen från länken. Öppna **Analysera ett jobb** igen och klistra in annonstexten under **Jobbtext (valfritt)**, så tar vi det därifrån."
