name: Grace · Uppdatera jobb

on:
  push:
    paths:
      - "CareerHub/config/search_profile.yaml"
      - "CareerHub/profile/candidate.yaml"
      - "CareerHub/careerhub.yaml"
  workflow_dispatch:
    inputs:
      specific_wishes_or_needs:
        description: "Specifika önskemål eller behov för just denna sökning (valfritt)"
        required: false
        type: string
        default: ""
  schedule:
    - cron: "20 5 * * 1-5"

permissions:
  contents: write

concurrency:
  group: careerhub-state-main
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      SEARCH_OVERLAY: ${{ inputs.specific_wishes_or_needs || '' }}
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
      JOOBLE_API_ENDPOINT: ${{ secrets.JOOBLE_API_ENDPOINT }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: Motherpher/CareerHubZero
          ref: main
          path: .careerhub-zero

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Förbered den centrala CareerHub-motorn
        run: pip install -r .careerhub-zero/requirements.txt

      - name: Hämta senaste profilstatus
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Sök och rangordna jobb
        env:
          PYTHONPATH: .careerhub-zero/src
        run: |
          python .careerhub-zero/scripts/careerhub.py \
            --manifest CareerHub/careerhub.yaml \
            scan \
            --lane all \
            --limit 80 \
            --search-overlay "$SEARCH_OVERLAY"

      - name: Spara uppdaterad CareerHub-status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            CareerHub/CONTROL_ROOM.md \
            CareerHub/JOB_VAULT.md \
            CareerHub/APPLICATIONS.md \
            CareerHub/data/latest_jobs.json \
            CareerHub/data/job_vault.json \
            CareerHub/data/applications.json \
            CareerHub/data/hrdm_ledger.json \
            CareerHub/data/maps 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Inga CareerHub-förändringar."
            exit 0
          fi
          git commit -m "Karriärhubben: uppdatera jobb"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
