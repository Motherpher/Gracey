name: Grace · Kontrollera karriärhubben

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "CareerHub/**"
      - ".github/workflows/careerhub-*.yml"
  push:
    branches: [main]
    paths:
      - "CareerHub/**"
      - ".github/workflows/careerhub-*.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Motherpher/CareerHubZero
          ref: main
          path: .careerhub-zero
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Förbered den centrala CareerHub-motorn
        run: pip install -r .careerhub-zero/requirements.txt
      - name: Kontrollera att profilen inte längre innehåller en egen motor
        run: |
          test -f CareerHub/careerhub.yaml
          test ! -d CareerHub/src
          test ! -d CareerHub/scripts
          test ! -d CareerHub/hrdm
          test ! -f CareerHub/requirements.txt
      - name: Kontrollera profilkontraktet mot den centrala motorn
        env:
          PYTHONPATH: .careerhub-zero/src
        run: python .careerhub-zero/scripts/careerhub.py --manifest CareerHub/careerhub.yaml validate
      - name: Bygg Grace-ytorna med den centrala motorn
        env:
          PYTHONPATH: .careerhub-zero/src
        run: python .careerhub-zero/scripts/careerhub.py --manifest CareerHub/careerhub.yaml render
      - name: Kontrollera att profilens historik och tillstånd finns kvar
        run: |
          test -f CareerHub/data/applications.json
          test -f CareerHub/data/job_vault.json
          test -f CareerHub/profile/candidate_verified.yaml
          test -f CareerHub/config/search_profile.yaml
          test -f CareerHub/CONTROL_ROOM.md
          test -f CareerHub/APPLICATIONS.md
          test -f CareerHub/JOB_VAULT.md
