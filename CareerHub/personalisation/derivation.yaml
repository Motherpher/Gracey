schema_version: "1.0"
profile_id: grace
state: IMPLEMENTATION_READY

principle:
  summary: "Grace uses the shared CareerHubZero body. Personalisation changes composition, language, visual grammar and interaction emphasis without creating a local runtime or a second evidence truth."

vectors:
  identity_signature:
    state: active
    decisions:
      - decision: "Use Grace as the visible identity and avoid an unverified professional title in the masthead."
        provenance: [EXPLICIT_USER, VERIFIED_CAREER]
        confidence: high
      - decision: "Use second-person address throughout normal user-facing copy."
        provenance: [EXPLICIT_USER]
        confidence: high
  work_logic_signature:
    state: active
    decisions:
      - decision: "Organise the landing experience around next action, opportunities, progress, prepared material and profile status."
        provenance: [EXPLICIT_USER, CHAT_PATTERN]
        confidence: high
  information_need_signature:
    state: active
    decisions:
      - decision: "High guidance with low cognitive clutter, airy density and progressive disclosure."
        provenance: [EXPLICIT_USER, CHAT_PATTERN]
        confidence: high
  career_surface_signature:
    state: active
    decisions:
      - decision: "Use one professional CareerHub surface until verified career evidence supports materially distinct professional surfaces."
        provenance: [VERIFIED_CAREER]
        confidence: high
  voice_signature:
    state: active
    decisions:
      - decision: "Warm, adult, self-assured and discreetly service-oriented Swedish."
        provenance: [EXPLICIT_USER]
        confidence: high
      - decision: "Prefer 'när du vill' and service-before-instruction phrasing."
        provenance: [EXPLICIT_USER, CHAT_PATTERN]
        confidence: high
  visual_grammar_signature:
    state: active
    decisions:
      - decision: "Editorial botanical-collage composition with parchment, espresso, teal, burnt orange, hibiscus red and botanical green; large serif display type and generous whitespace."
        provenance: [EXPLICIT_USER, VISUAL_HARVEST]
        confidence: high
      - decision: "Use teal as the functional action colour, botanical green as secondary structure, burnt orange as highlight and hibiscus red as signal/accent."
        provenance: [VISUAL_HARVEST]
        confidence: high
      - decision: "Use textile/damask rhythm, botanical collage and parchment/cartographic texture as abstract visual grammar; never copy the supplied artworks."
        provenance: [VISUAL_HARVEST]
        confidence: high
      - decision: "Do not reproduce Prada or Gucci trade dress; use the reference only as a service-experience metaphor."
        provenance: [EXPLICIT_USER]
        confidence: high
  interaction_signature:
    state: active
    decisions:
      - decision: "Lead with what is ready and what the user can do next rather than configuration or system state."
        provenance: [EXPLICIT_USER, CHAT_PATTERN]
        confidence: high
      - decision: "Keep the service-facing flow simple: Hitta jobb → Analysera? → Sök → Följ."
        provenance: [EXPLICIT_USER]
        confidence: high
  reference_provenance:
    state: active
    decisions:
      - decision: "Every material deviation from CHZero defaults has explicit provenance and no sensitive/private-life attribute is admissible."
        provenance: [EXPLICIT_USER, VERIFIED_CAREER]
        confidence: high

core_invariants:
  - "CareerHubZero remains the only runtime authority."
  - "Candidate truth remains bound to verified career sources."
  - "Search wishes remain search-only and cannot become candidate evidence."
  - "Accessibility primitives remain central and reusable."
  - "No local fork of shared React components."

lock_conditions:
  contracts_valid: false
  provenance_complete: true
  central_localisation_resolved: false
  swedish_user_path_complete: false
  accessibility_pass: false
  anti_generic_pass: false
  preview_reviewed: true
  unsupported_candidate_claims: false
